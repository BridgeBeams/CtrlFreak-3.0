<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tile background: deep slate with a subtle top-light -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2333"/>
      <stop offset="0.55" stop-color="#0f1622"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <!-- Accent gradient for the mark -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- subtle inner top highlight -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Glow behind the mark -->
  <circle cx="256" cy="248" r="180" fill="url(#glow)"/>

  <!-- Radar / control signal rings -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <circle cx="256" cy="248" r="150" stroke-opacity="0.28" stroke-width="10"/>
    <circle cx="256" cy="248" r="112" stroke-opacity="0.55" stroke-width="12"/>
    <!-- broken outer arc for a techy feel -->
    <path d="M256 68 A180 180 0 0 1 436 248" stroke-opacity="0.9" stroke-width="14"/>
    <path d="M256 428 A180 180 0 0 1 76 248" stroke-opacity="0.9" stroke-width="14"/>
  </g>

  <!-- Central caret (the Ctrl symbol) as a solid glowing chevron -->
  <g>
    <path d="M256 150 L336 300 L300 300 L256 216 L212 300 L176 300 Z"
          fill="url(#accent)" filter="url(#soft)" opacity="0.9"/>
    <path d="M256 150 L336 300 L300 300 L256 216 L212 300 L176 300 Z"
          fill="url(#accent)"/>
    <!-- small pulse dot at the core -->
    <circle cx="256" cy="330" r="16" fill="#5aa2ff"/>
  </g>
</svg>
